name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Point publicUrl to GitHub Pages (build-time only)
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.targets.default.publicUrl='/betatransfer-kassa/';fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
      - name: Build
        run: |
          npm run sprites
          npx parcel build --no-source-maps --target default
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
