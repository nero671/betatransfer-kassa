name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm install
          # current Parcel image transformer needs sharp ^0.33 (package.json pins ^0.31) - CI only
          npm install --no-save sharp@^0.33.5
      - name: CI-only fixes (repo files are not changed)
        run: |
          # src/components/animations/ was never committed (.gitignore has "animations"),
          # but index.css and index.js import from it -> create empty placeholders if missing
          mkdir -p src/components/animations
          [ -f src/components/animations/animation.css ] || echo "/* placeholder: original file is not in the repo */" > src/components/animations/animation.css
          [ -f src/components/animations/animations.js ] || echo "export default {};" > src/components/animations/animations.js
          # pages reference Acquiring.mp4, repo has acquiring.mp4 (macOS is case-insensitive, Linux is not)
          [ -f src/assets/video/Acquiring.mp4 ] || cp src/assets/video/acquiring.mp4 src/assets/video/Acquiring.mp4
      - name: Build
        run: |
          npm run sprites
          npx parcel build --no-source-maps --target default
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
